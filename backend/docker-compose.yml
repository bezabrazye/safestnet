version: "3.8"
services:
  db:
    image: postgres:16-alpine
    container_name: safenet_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safenet
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: safenet_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
